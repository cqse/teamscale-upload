import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.api.tasks.testing.logging.TestExceptionFormat

import java.nio.ByteBuffer
import java.nio.ByteOrder

plugins {
	id 'org.beryx.runtime'
	id 'java'
}

repositories {
	maven {
		url = "https://packages.jetbrains.team/maven/p/ij/intellij-dependencies/"
	}
	mavenCentral()
}

group = "com.teamscale"
version = "1.0-SNAPSHOT"

application {
	applicationName = 'teamscale-upload'

	mainClass = 'com.teamscale.upload.TeamscaleUpload'

	applicationDefaultJvmArgs = [
			// Ensure that no stack traces are lost.
			// See <https://stackoverflow.com/questions/2411487/nullpointerexception-in-java-with-no-stacktrace>
			'-XX:-OmitStackTraceInFastThrow',
			// JNA (used by jvm-native-trusted-roots to read the OS certificate store) loads native code.
			// Without this, Java 24+ prints a warning on every run and a future release will block the call.
			'--enable-native-access=ALL-UNNAMED',
	]
}

java {
	toolchain {
		// Ensure that we build with the same version that we want to jlink to the distribution.
		// The runtime plugin runs jlink from this toolchain, and jlink rejects jmods of a different Java version.
		languageVersion = JavaLanguageVersion.of(25)
		// Same vendor as the jmods that are linked into the distribution
		vendor = JvmVendorSpec.ADOPTIUM
	}
}

dependencies {
	implementation 'org.apache.commons:commons-exec:1.3'
	implementation 'commons-io:commons-io:2.11.0'
	implementation 'org.apache.commons:commons-compress:1.21'
	implementation 'org.apache.commons:commons-lang3:3.12.0'
	implementation 'com.google.code.gson:gson:2.8.9'
	implementation 'com.google.guava:guava:32.1.2-jre'
	implementation 'com.squareup.okhttp3:okhttp:5.1.0'
	implementation 'net.sourceforge.argparse4j:argparse4j:0.9.0'
	implementation 'org.jetbrains.nativecerts:jvm-native-trusted-roots:1.0.19'

	testImplementation 'com.sparkjava:spark-core:2.9.4'

	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation 'org.junit.jupiter:junit-jupiter-api'
	testImplementation 'org.junit.jupiter:junit-jupiter-params'
	testRuntimeOnly  'org.junit.jupiter:junit-jupiter-engine'

	testImplementation 'org.assertj:assertj-core:3.21.0'
	testRuntimeOnly 'javax.servlet:javax.servlet-api:4.0.1'

	testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}
/* A provider that lazily executes 'git describe' and calculates the version.
 * This is Configuration Cache SAFE.
 */
def gitVersionProvider = providers.exec {
	// Run 'git describe --tags'. This handles both exact tags and dev commits.
	commandLine 'git', 'describe', '--tags'
	// Ignore the exit value so the build doesn't fail if there are no tags.
	ignoreExitValue = true
	// We'll process the output (including errors) in the .map() block below.
}.standardOutput.asText.map { output ->
	def fullVersion = output.trim()
	if (fullVersion.isEmpty()) {
		// If git describe fails (e.g., no repo, no tags), use a default.
		return "0.1.0-SNAPSHOT"
	}
	if (fullVersion.contains('-')) {
		// It's a development commit, e.g., "v1.2.0-5-gabc123d".
		// We want to turn this into "1.2.0-SNAPSHOT".
		def baseVersion = fullVersion.split('-')[0]
		baseVersion = baseVersion.startsWith('v') ? baseVersion.substring(1) : baseVersion
		return "${baseVersion}-SNAPSHOT"
	} else {
		// It's an exact tag match, e.g., "v1.2.0". This is a release.
		return fullVersion.startsWith('v') ? fullVersion.substring(1) : fullVersion
	}
}
// === Set the project version using the provider ===
version = gitVersionProvider
// === Task to generate the Version.java source file ===
def generatedSourcesDir = layout.buildDirectory.dir('generated/sources/java')

tasks.register('generateVersionSource', Copy) {
	description = 'Generates the Version.java class from its template.'
	group = 'Source Generation'

	from('src/main/templates/java')
	// The template file is our input
	include('**/ToolVersion.java')
    // The generated sources directory is our output
	into(generatedSourcesDir)

	// Replace the ${ToolVersion} token with the actual project version
	// Instead of passing all properties, we pass a map where the
	// all values are provider. This triggers Gradle's lazy, provider-aware
	// expansion logic. Otherwise it would just call provider.toString() and
	// write "map(map(map(valueof(ProcessOutputValueSource))))" as version number.
	expand([ 'ToolVersion': project.version.get() ])
}

// Add the generated sources directory to the 'main' source set.
// This tells the 'compileJava' task to include the generated file.
// It also automatically makes 'compileJava' depend on 'generateVersionSource'.
sourceSets {
	main {
		java {
			srcDir generatedSourcesDir
		}
	}
}
tasks.named('compileJava') {
	dependsOn(tasks.named('generateVersionSource'))
}
tasks.named('build') {
	dependsOn(tasks.named('generateVersionSource'))
}
tasks.named('distTar') {
	archiveVersion.set(gitVersionProvider)
}
tasks.named('distZip') {
	archiveVersion.set(gitVersionProvider)
}

tasks.named('jar') {
	// Explicitly set the archiveVersion using our provider. This is the correct lazy configuration.

	// If we don't set this, then the "jar" task will implicitly use project.version (which is not a string but a provider) and append it to the application name.
	// Result would be a "teamscale-upload-map(map(map(valueof(ProcessOutputValueSource)))).jar".
	archiveVersion.set(gitVersionProvider)
}

/** Downloads the file at {@code url} to {@code destination}. */
abstract class DownloadFile extends DefaultTask {

	@Input
	abstract Property<String> getUrl()

	@OutputFile
	abstract RegularFileProperty getDestination()

	@TaskAction
	void download() {
		URI.create(url.get()).toURL().withInputStream { input ->
			destination.get().asFile.withOutputStream { it << input }
		}
	}
}

def RUNTIME_JDK_VERSION = '25.0.4.1+1'
def ADOPTIUM_BINARY_REPOSITORY = 'https://api.adoptium.net/v3/binary'
// Target platform name -> [Adoptium OS, Adoptium architecture, archive extension]
def RUNTIME_TARGET_PLATFORMS = [
		'linux-x86_64'  : ['linux', 'x64', 'tar.gz'],
		'windows-x86_64': ['windows', 'x64', 'zip'],
		'macos-x86_64'  : ['mac', 'x64', 'tar.gz'],
		'macos-aarch64' : ['mac', 'aarch64', 'tar.gz'],
]

// The runtime plugin passes <jdkHome>/jmods to jlink as the module path
def jdkHomeDir = { String platformName -> layout.buildDirectory.dir("jdks/${platformName}") }
def jmodsDir = { String platformName -> jdkHomeDir(platformName).map { it.dir('jmods') } }

// Since Java 24, Adoptium JDKs no longer ship jmods (JEP 493), so jlink needs them as a separate download
def unpackJmodsTasks = RUNTIME_TARGET_PLATFORMS.collect { platformName, adoptiumPlatform ->
	def (operatingSystem, architecture, extension) = adoptiumPlatform
	def downloadTask = tasks.register("downloadJmods-${platformName}", DownloadFile) {
		url = "$ADOPTIUM_BINARY_REPOSITORY/version/jdk-${RUNTIME_JDK_VERSION}/${operatingSystem}/${architecture}/jmods/hotspot/normal/eclipse"
		destination = jdkHomeDir(platformName).map { it.file("jmods.${extension}") }
	}
	tasks.register("unpackJmods-${platformName}", Sync) {
		from(downloadTask.flatMap { it.destination }.map { archive ->
			if (extension == 'zip') {
				return zipTree(archive)
			}
			return tarTree(resources.gzip(archive))
		})
		include('*/*.jmod')
		// The archive has a single top-level directory, which jlink must not see
		eachFile { it.path = it.name }
		includeEmptyDirs = false
		into(jmodsDir(platformName))
	}
}

// The jre task runs jlink
tasks.named('jre') {
	// An input, not just a dependency, so that new jmods (for example from a RUNTIME_JDK_VERSION update) relink the runtime
	inputs.files(unpackJmodsTasks).withPropertyName('targetPlatformJmods').withPathSensitivity(PathSensitivity.RELATIVE)
	// Without jmods, the runtime plugin silently links the build host's own runtime instead of the target platform's
	def javaBaseJmods = RUNTIME_TARGET_PLATFORMS.keySet().collect { platformName ->
		jmodsDir(platformName).map { it.file('java.base.jmod') }
	}
	doFirst {
		javaBaseJmods.each { javaBaseJmod ->
			if (!javaBaseJmod.get().asFile.file) {
				throw new GradleException("Missing ${javaBaseJmod.get().asFile}, jlink would link the build host's runtime instead")
			}
		}
	}
}

runtime {
	options = [
			'--compress', 'zip-6',
			'--no-header-files', '--no-man-pages',
			'--dedup-legal-notices', 'error-if-not-same-content',
			'--strip-debug',
	]

	modules = [
			'java.logging', // For package java.util.logging (used by Google Guava)
			'java.naming', // For package javax.naming (used by Apache HttpClient)
			'jdk.unsupported', // For GSON
	]

	RUNTIME_TARGET_PLATFORMS.keySet().each { platformName ->
		targetPlatform(platformName) {
			jdkHome = jdkHomeDir(platformName).map { it.asFile.absolutePath }
		}
	}
	imageDir.set(layout.buildDirectory.dir("runtime/install"))
	imageZip.set(layout.buildDirectory.file("runtime/zip/${application.applicationName}.zip"))
}

/**
 * Returns the target platform name (a key of RUNTIME_TARGET_PLATFORMS) that the given native executable is built for,
 * or {@code null} if the format or the architecture is none of them.
 */
static String detectExecutablePlatform(File executable) {
	byte[] header = new byte[4096]
	executable.withInputStream { it.read(header) }
	ByteBuffer littleEndian = ByteBuffer.wrap(header).order(ByteOrder.LITTLE_ENDIAN)
	if (littleEndian.getInt(0) == 0x464C457F) {
		// ELF: e_machine 0x3E is x86-64
		if (Short.toUnsignedInt(littleEndian.getShort(18)) == 0x3E) {
			return 'linux-x86_64'
		}
	} else if (Integer.toUnsignedLong(littleEndian.getInt(0)) == 0xFEEDFACFL) {
		// 64-bit Mach-O: cputype 0x01000007 is x86-64, 0x0100000C is arm64
		int cpuType = littleEndian.getInt(4)
		if (cpuType == 0x01000007) {
			return 'macos-x86_64'
		}
		if (cpuType == 0x0100000C) {
			return 'macos-aarch64'
		}
	} else if (Short.toUnsignedInt(littleEndian.getShort(0)) == 0x5A4D) {
		// PE ("MZ"): the COFF header's machine field 0x8664 is x86-64
		int peHeaderOffset = littleEndian.getInt(0x3C)
		if (Short.toUnsignedInt(littleEndian.getShort(peHeaderOffset + 4)) == 0x8664) {
			return 'windows-x86_64'
		}
	}
	return null
}

// Guards against shipping a runtime for the wrong platform, which no test would notice, because CI runs only the Linux image
tasks.named('runtime') {
	def runtimeImageDir = runtime.imageDir
	def imageNamePrefix = project.name
	def platformNames = RUNTIME_TARGET_PLATFORMS.keySet()
	doLast {
		platformNames.each { platformName ->
			File binDir = runtimeImageDir.dir("${imageNamePrefix}-${platformName}/bin").get().asFile
			File javaExecutable = [new File(binDir, 'java'), new File(binDir, 'java.exe')].find { it.file }
			if (javaExecutable == null) {
				throw new GradleException("No java executable found in ${binDir}")
			}
			String actualPlatform = detectExecutablePlatform(javaExecutable)
			if (actualPlatform != platformName) {
				throw new GradleException("${javaExecutable} is built for ${Objects.requireNonNullElse(actualPlatform, 'an unknown platform')}, expected ${platformName}")
			}
		}
	}
}

// Use afterEvaluate to defer this logic until the configuration phase is complete.
// This guarantees that 'extensions.runtime.targetPlatforms' is populated.
project.afterEvaluate {
	// We still need to .get() here, but it's now safe inside afterEvaluate.
	extensions.runtime.targetPlatforms.get().each { targetPlatform ->
		tasks.register("customRuntimeZip-${targetPlatform.key}", Zip) {
			group = 'Build'
			description = "Builds a custom runtime zip for ${targetPlatform.key}"

			dependsOn tasks.named('runtime')
			dependsOn(tasks.named('generateVersionSource'))

			// The doFirst check is an execution-time action, so it's perfectly fine.
			doFirst {
				// It's better to check the target, not the build host, for this logic.
				// If building a linux zip on Windows is the issue, this check is correct.
				if (Os.isFamily(Os.FAMILY_WINDOWS) && !targetPlatform.key.contains('windows')) {
					throw new GradleException("Can't build non-Windows distributions on a Windows host due to lost file permissions. Target was: ${targetPlatform.key}.")
				}
			}

			// --- LAZY PROPERTY ASSIGNMENTS ---
			// Use .set() for modern lazy properties instead of direct assignment (=).
			destinationDirectory.set(layout.buildDirectory.dir('distributions'))
			// Use a provider for the applicationName to ensure it's also lazy.
			archiveFileName.set("${application.applicationName}-${targetPlatform.key}.zip")
			// Gradle normalizes archive permissions to 644 by default, which would drop the executable bit of the launcher and the bundled JVM
			useFileSystemPermissions()

			// --- LAZY FILE SELECTION ---
			// The content of the zip is configured lazily.
			from(runtime.imageDir.dir("${project.name}-${targetPlatform.key}")) {
				into(application.applicationName) // applicationName is a Provider
			}

			from("distribution_readme/README.md") {
				into(application.applicationName)
			}
			from(project.provider {
				"build/version.txt"
			}) {
				rename { "version.txt" }
				into(application.applicationName)
			}
		}
	}
}

test {
	useJUnitPlatform()
	testLogging {
		outputs.upToDateWhen { false }
		showStandardStreams = true
		showExceptions = true
		showCauses = true
		exceptionFormat = TestExceptionFormat.FULL
		events "passed"
	}
}
tasks.register('printVersion') {
	description = 'Prints the current project version to the console.'
	group = 'Versioning' // Puts it in a nice group in `gradle tasks`

	// This block runs during the Execution Phase
	doLast {
		// Gradle automatically unwraps the version Provider when accessed here
		println "Project version: ${project.version.get()}"
	}
}
